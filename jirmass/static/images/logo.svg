<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 14 432 140" width="100%" height="100%">
  <defs>
    <style>
      .navy-fill { fill: #111a36; }
      .red-fill  { fill: #d3222a; }
      .brand-title {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Montserrat, Arial, sans-serif;
        font-weight: 900;
        font-size: 52px;
        fill: #111a36;
        letter-spacing: 2px;
      }
      .brand-subtitle {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Montserrat, Arial, sans-serif;
        font-weight: 800;
        font-size: 17px;
        fill: #d3222a;
        letter-spacing: 6.5px;
      }
    </style>
  </defs>

  <!-- Group: Emblem Icon (Left) -->
  <g id="icon-mark" transform="translate(10, 0)">
    <!-- Bottom Navy Swoosh -->
    <path class="navy-fill" d="M 38 104 C 40 128, 62 145, 96 148 C 140 152, 178 128, 192 78 C 196 64, 197 54, 197 50 C 195 56, 187 86, 168 106 C 146 128, 118 135, 92 133 C 68 131, 50 120, 42 108 Z" />
    
    <!-- Top Red Arc -->
    <path class="red-fill" d="M 52 92 C 50 78, 56 56, 75 40 C 98 21, 132 20, 164 42 C 152 35, 126 28, 98 34 C 76 39, 62 55, 58 76 C 56 82, 54 88, 52 92 Z" />
    
    <!-- Top-Right Red Sparkle/Star -->
    <polygon class="red-fill" points="163,22 165,16 167,22 173,24 167,26 165,32 163,26 157,24" />

    <!-- Center JP Monogram -->
    <!-- Letter 'J' (Navy) -->
    <path class="navy-fill" d="M 85 64 L 102 64 L 102 96 C 102 104, 98 109, 90 110 C 82 111, 74 107, 72 101 L 84 97 C 84 99, 86 100, 89 100 C 91 100, 92 98, 92 95 L 92 64 Z" />
    
    <!-- Letter 'P' (Red) -->
    <path class="red-fill" d="M 112 64 L 132 64 C 142 64, 149 68, 149 76 C 149 84, 142 88, 132 88 L 122 88 L 122 110 L 112 110 Z M 122 72 L 122 80 L 131 80 C 135 80, 138 78, 138 76 C 138 73, 135 72, 131 72 Z" />
  </g>

  <!-- Group: Typography (Right) -->
  <g id="brand-text">
    <text x="225" y="90" class="brand-title">JIRMASS</text>
    <text x="227" y="118" class="brand-subtitle">PLASTICS LIMITED</text>
  </g>
</svg>
